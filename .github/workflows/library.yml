name: Library checks
on:
  push:
    branches: [main]
    paths: ['library*', 'hidden-menu.html', 'tests/library*', '.github/workflows/library.yml']
  pull_request:
    paths: ['library*', 'hidden-menu.html', 'tests/library*', '.github/workflows/library.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/library.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: node tests/library-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-screenshots
          path: test-results/library-*.png
          retention-days: 14
