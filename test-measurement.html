<title>試験・測定｜ぷかぷかうきわメモ</title>
<style>
:root{--ink:#123f5e;--muted:#6a8290;--line:#cfe6ee;--blue:#0b8fbd;--bg:#eafaff}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#e8faff,#f8fcfd)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
header a{text-decoration:none;color:#176888;font-weight:1000}
main{width:min(880px,calc(100% - 18px));margin:0 auto;padding:22px 0 40px}
.hero{padding:22px;border-radius:24px;background:linear-gradient(145deg,#0b76ac,#17abc5);color:#fff;box-shadow:0 18px 38px rgba(0,75,105,.12)}
.hero span{font-size:8px;letter-spacing:.16em;font-weight:1000}
.hero h1{margin:5px 0 5px;font-size:clamp(32px,7vw,48px)}
.hero p{margin:0;font-size:12px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.card{min-height:145px;padding:16px;border:1px solid var(--line);border-radius:19px;background:#fff;text-decoration:none;color:var(--ink);box-shadow:0 8px 20px rgba(0,75,105,.07)}
.card .icon{font-size:28px}.card b{display:block;margin-top:8px;font-size:18px}.card small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.5}
.card.live{border-color:#8dd4e5;background:linear-gradient(145deg,#fff,#effbff)}
.badge{display:inline-block;margin-top:9px;padding:4px 7px;border-radius:999px;background:#eaf8fd;color:#177091;font-size:8px;font-weight:1000}
.note{margin-top:14px;padding:13px 14px;border-radius:15px;background:#fff7e8;border:1px solid #ead39a;color:#695425;font-size:9px;line-height:1.65}
@media(max-width:620px){.grid{grid-template-columns:1fr}.hero{padding:18px}.card{min-height:116px}}
</style>
</head>
