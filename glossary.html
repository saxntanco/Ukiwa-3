<main>
<h1>📖 用語・機器図鑑</h1>
<p class="lead">現場で出会う略語と用語を、<b>英語の正式名・日本語・読み</b>とひとこと解説つきで。たとえば PAS は <b>Pole Air Switch</b>（柱上気中開閉器）。略語・英語・日本語・ひらがなのどれからでも探せます。</p>
<div class="tools"><input id="q" class="search" type="search" placeholder="例：PAS、遮断器、ground、ちらく" aria-label="用語を探す"><div class="cats" id="cats" role="group" aria-label="分類でしぼりこむ"></div><div class="count" id="count" aria-live="polite"></div></div>
<div class="grid" id="list"></div>
<p class="note">英語の名前は、日本の現場で使われている呼び方を中心にしています。メーカーや資料によって表記が違うことがあります。器具番号は代表的な例です。実際の設備・試験では、取扱説明書や社内の手順を確認してください。</p>
</main>
<script src="glossary-data.js?v=2"></script>
<script>
(()=>{
const D=window.UkiwaGlossary,C=window.UkiwaGlossaryCats,catName=Object.fromEntries(C);
const list=document.getElementById('list'),q=document.getElementById('q'),cats=document.getElementById('cats'),count=document.getElementById('count');
let cat='all';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFKC').replace(/[ァ-ン]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s・\-–]/g,'');
const hl=(s,w)=>{s=esc(s);if(!w)return s;const i=s.toLowerCase().indexOf(w.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+w.length)+'</mark>'+s.slice(i+w.length)};
const btn=(k,label,n)=>{const b=document.createElement('button');b.type='button';b.textContent=label+'（'+n+'）';b.setAttribute('aria-pressed',k===cat);b.onclick=()=>{cat=k;[...cats.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};cats.append(b)};
btn('all','すべて',D.length);C.forEach(([k,l])=>btn(k,l,D.filter(r=>r[4]===k).length));
function render(){
 const raw=q.value.trim(),w=norm(raw);
 const rows=D.filter(r=>(cat==='all'||r[4]===cat)&&(!w||norm(r[0]+r[1]+r[2]+r[3]+r[5]).includes(w)));
 rows.sort((a,b)=>{if(!w)return 0;const s=r=>norm(r[0])===w?0:norm(r[0]).startsWith(w)?1:norm(r[2]+r[3]).includes(w)?2:3;return s(a)-s(b)});
 count.textContent=rows.length+'語'+(raw?'（「'+raw+'」で検索）':'');
 list.innerHTML=rows.length?rows.map(r=>{const links=r[6]?r[6].split(';').map(x=>{const[h,l]=x.split('|');return '<a href="'+esc(h)+'">'+esc(l)+' →</a>'}).join(''):'';
  return '<article class="term"><span class="cat">'+esc(catName[r[4]])+'</span>'+(r[0]?'<span class="ab">'+hl(r[0],raw)+'</span>':'')+'<span class="en">'+hl(r[1],raw)+'</span><div class="ja">'+hl(r[2],raw)+'</div><div class="kana">'+esc(r[3])+'</div><p>'+esc(r[5])+'</p>'+(links?'<div class="links">'+links+'</div>':'')+'</article>'}).join(''):'<div class="empty">見つかりませんでした。別の言い方（英語・ひらがな）でも探してみてください。</div>';
}
q.addEventListener('input',render);
const p=new URLSearchParams(location.search).get('q');if(p)q.value=p;
render();
})();
</script>
