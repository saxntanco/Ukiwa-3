<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>360モデル 表示幅の検証</title><style>body{margin:10px;font:14px system-ui;background:#dce6eb}button,select{padding:8px;margin:3px}iframe{display:block;border:1px solid #8198a4;height:880px;max-width:none;background:white}nav{margin-bottom:8px}</style><nav><label>モデル <select id="model"><option value="vcb-3d.html">VCB</option><option value="pas-vtla-3d.html">PAS</option><option value="vt-withstand-3d.html">VT</option><option value="ds-3d.html">DS</option><option value="lbs-3d.html">LBS</option><option value="la-3d.html">LA</option><option value="zct-3d.html">ZCT</option></select></label><button data-width="390">スマホ幅390</button><button data-width="768">タブレット幅768</button><button data-width="1100">PC幅1100</button><span id="label">390 CSS px</span></nav><iframe id="preview" title="モデル検証画面" width="390" src="../vcb-3d.html"></iframe><script>const f=document.getElementById('preview');document.getElementById('model').onchange=e=>f.src='../'+e.target.value;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.width=b.dataset.width;document.getElementById('label').textContent=b.dataset.width+' CSS px';});</script></html>
