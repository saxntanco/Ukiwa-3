<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メニューレイアウトの表示確認</title>
<style>body{font:16px system-ui;background:#eaf3f7;color:#163c4b;margin:16px}label{display:inline-block;margin:0 14px 12px 0}select{padding:8px}iframe{display:block;border:1px solid #698790;background:white;height:780px}#stage{overflow:auto}</style>
<h1>メニューレイアウトの表示確認</h1><p>表示幅を切り替え、検索・入力・教材選択を実際に操作するための確認ページです。</p>
<label>ページ <select id="page"></select></label><label>表示幅 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1280</option></select> px</label>
<div id="stage"><iframe id="preview" title="選択したページのプレビュー" width="390" src="../protective-relay.html"></iframe></div>
<script>
const pages=['protective-relay','test-measurement','ocr-tap-calculator','ac-withstand-test-simulator','generator-rescue-island','sequence-basics','vcb-inspection-guide','instrument-calibration-guide','ppe-withstand-guide','cable-size-simulator','equipment-map'];
const page=document.getElementById('page'),frame=document.getElementById('preview');
for(const name of pages){const option=document.createElement('option');option.value=name;option.textContent=name;page.append(option)}
page.addEventListener('change',()=>frame.src='../'+page.value+'.html');
document.getElementById('width').addEventListener('change',e=>frame.width=e.target.value);
</script></html>
